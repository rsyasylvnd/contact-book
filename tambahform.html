<!DOCTYPE html>
<html>
<head>
  <title>Buku Kontak</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Buku Kontak</h1>

  <!-- Form input kontak -->
  <form id="formKontak">
    <input type="text" id="nama" placeholder="Masukkan Nama" required>
    <input type="text" id="nomor" placeholder="Masukkan Nomor" required>
    <button type="submit">Tambah Kontak</button>
  </form>

  <table>
    <tr>
      <th>Nama</th>
      <th>Nomor</th>
    </tr>
  </table>

  <script src="script.js"></script>
</body>
</html>
